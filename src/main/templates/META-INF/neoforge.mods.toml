description='''
Oito armas com as animações feitas no Blender: revólver, Desert Eagle, AK-47, M4A4, M4A1-S, metralhadora,
escopeta 12 e sniper .338, cada uma com a sua munição. Recarregar: tecla R. Luneta da sniper: agachar.
'''

